# Render Blueprint for ArbiHunt
# Deploy: render.com -> New -> Blueprint -> point at this repo.
#
# Two services on Render, both from this repo:
#   1) arbihunt-3  — Web Service (Node, scanner + API + WebSocket)
#   2) arbihunt-4  — Static Site (Vite-built React SPA)
#
# The /api/* and /ws paths on the static site are rewrites (server-side
# proxy) to the backend so the browser stays on the static-site origin
# and no CORS surface is exposed.
#
# The 36-exchange scanner runs in a long-lived Node process; the WS
# upgrade path needs a Web Service (serverless functions do not
# support it). The client is pure static assets, so a Static Site is
# cheaper and faster than a Web Service.
#
# Notes:
# - Both services on the free plan. Free Web Service spins down after
#   ~15 min idle; keep it warm with an external ping (UptimeRobot or
#   similar) hitting the backend's /api/health every ~14 min.
# - render.yaml syntax is YAML 1.2. Indentation matters.
# - The 460MB heap cap on the backend matches the free tier's
#   container limit. Each ExchangeAgent owns a bounded LRU so the
#   total cache footprint stays well under that ceiling.

services:
  # ---- Backend: scanner + REST API + WebSocket ----
  # Live deploy name on Render: arbihunt-3 (this account's existing Web Service).
  - type: web
    name: arbihunt-3
    runtime: node
    rootDir: server
    plan: free
    region: oregon
    # The --max-old-space-size flag caps V8's heap so a runaway
    # agent cannot push the whole container over the free-tier
    # 512MB container limit. 460MB leaves headroom for V8 baseline
    # + RSS overhead.
    startCommand: node --max-old-space-size=460 src/index.js
    buildCommand: npm install
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Frontend origin (the Static Site deployed on the same account).
      # Used by the CORS allowlist in server/src/index.js.
      - key: CLIENT_ORIGIN
        value: https://arbihunt-4.onrender.com
      - key: HOST
        value: 0.0.0.0
      - key: OWNER_EMAIL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: USDT_TRON_ADDRESS
        sync: false
      - key: USDT_BSC_ADDRESS
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
      - key: BSCSCAN_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "ArbiHunt <noreply@example.com>"
      - key: RESET_CODE_EXPOSED
        value: "false"
      - key: ENABLE_DEMO_SEED
        value: "false"
      - key: SCAN_INTERVAL_MS
        value: "25000"
      - key: MAX_OPPORTUNITIES
        value: "1000"

  # ---- Frontend: Vite-built React SPA, served as static assets ----
  # Live deploy name on Render: arbihunt-4 (this account's existing Static Site).
  - type: static
    name: arbihunt-4
    rootDir: client
    # Vite's `build` script produces a static bundle in `dist/`.
    # Render Static Sites serve whatever is in `staticPublishPath`
    # exactly as-is.
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Routes. Order matters — the more specific rewrites come first.
    # 1) /api/<path> proxied to the backend Web Service so the
    #    browser stays on the static-site origin (no CORS).
    # 2) /ws proxied to the backend's WebSocket endpoint. Render's
    #    rewrite engine supports WS upgrades.
    # 3) SPA fallback: any unknown path returns index.html so React
    #    Router can take over. Without this, /dashboard would 404.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://arbihunt-3.onrender.com/api/*
      - type: rewrite
        source: /ws
        destination: https://arbihunt-3.onrender.com/ws
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

    envVars:
      # Vite reads import.meta.env.VITE_API_URL at build time and
      # bakes it into the bundle. The client/src/api.jsx module
      # resolves API_BASE and WS_URL from this single env var. No
      # trailing slash.
      - key: VITE_API_URL
        value: https://arbihunt-3.onrender.com

    headers:
      # Long cache for hashed assets (Vite emits /assets/<hash>).
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Never cache the index.html itself so deploys take effect
      # immediately.
      - path: /*
        name: Cache-Control
        value: no-cache
